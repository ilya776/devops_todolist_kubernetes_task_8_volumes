apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todoapp-pvc
  labels:
    app: todoapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: todoapp-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp-container
          image: ikulyk404/todoapp:3.0.0
          volumeMounts:
            - mountPath: /app/data
              name: todoapp-pv
      volumes:
        - name: todoapp-pv
          persistentVolumeClaim:
            claimName: todoapp-pvc